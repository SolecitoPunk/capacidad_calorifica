<script>
"use strict";
window.onerror=(m,s,l,c,e)=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='Error: '+m+' (línea '+l+')\n';};
const NOTAS=[{"cabecera": "Diapositiva 1 · Portada · Sebastián · 0:00–0:45", "parrafos": ["Sebastián: Buenos días, profesor y compañeros. Somos Sebastián Sánchez, Joan Tovar y Jorge Garzón. Hoy les presentamos nuestro proyecto de simulación: la capacidad calorífica electrónica de un metal a temperatura finita, usando el modelo de Sommerfeld. Yo voy a introducir la física del problema, Joan explicará cómo calculamos el potencial químico y la energía interna, y Jorge mostrará la capacidad calorífica y lo que obtenemos al aplicarlo a un metal real."]}, {"cabecera": "Diapositiva 2 · Motivación · Sebastián · 0:45–2:15", "parrafos": ["Sebastián: Empecemos con una pregunta. En un metal como el cobre cada átomo aporta un electrón libre. Si esos electrones se comportaran como un gas ideal clásico, cada uno aportaría tres medios de k_B a la capacidad calorífica, por el teorema de equipartición. Eso sería tan grande como la contribución de la red cristalina.", "Sin embargo, los experimentos muestran que la contribución de los electrones a temperatura ambiente es apenas del orden del uno por ciento de ese valor. La física clásica no puede explicar esta diferencia.", "La respuesta la dio Arnold Sommerfeld en 1928. Los electrones son fermiones y obedecen el principio de exclusión de Pauli. Solo los electrones cercanos a la energía de Fermi, en una franja de ancho del orden de k_BT, pueden absorber energía térmica. El resultado es una capacidad calorífica que crece linealmente con la temperatura: C_V = γT. Nuestro proyecto comprueba esto numéricamente, sin usar la aproximación analítica."]}, {"cabecera": "Diapositiva 3 · Objetivos · Sebastián · 2:15–3:00", "parrafos": ["Sebastián: Nuestro objetivo general es simular la contribución electrónica a la capacidad calorífica integrando la densidad de estados con la distribución de Fermi-Dirac. Para eso tenemos dos objetivos específicos. El primero es calcular la energía interna térmica integrando numéricamente el producto de la densidad de estados, la energía y la distribución de Fermi-Dirac. El segundo es obtener la capacidad calorífica por derivación numérica y compararla con la aproximación lineal de Sommerfeld."]}, {"cabecera": "Diapositiva 4 · Modelo físico · Sebastián · 3:00–4:45", "parrafos": ["Sebastián: El modelo tiene dos ingredientes. El primero es la densidad de estados de un gas de electrones libres en tres dimensiones, que crece como la raíz cuadrada de la energía. Aquí la vemos en la animación: a temperatura cero todos los estados están llenos hasta la energía de Fermi, que es la zona sombreada.", "El segundo ingrediente es la distribución de Fermi-Dirac, que da la probabilidad de que un estado de energía E esté ocupado. A temperatura cero es un escalón perfecto. Al subir la temperatura, el escalón se suaviza en una franja de ancho k_BT alrededor del potencial químico μ. (Señalar la gráfica 2.) Fíjense en que μ depende de la temperatura: no podemos dejarlo fijo, porque el número de electrones tiene que conservarse. Ese es el primer problema numérico, y Joan lo va a explicar.", "Con estos dos ingredientes, el número de electrones es la integral de g por f, y la energía interna es la integral de E por g por f."]}, {"cabecera": "Diapositiva 5 · Unidades y predicción de Sommerfeld · Sebastián · 4:45–6:30", "parrafos": ["Sebastián: Para que el problema sirva para cualquier metal trabajamos en unidades adimensionales. Medimos la energía en unidades de la energía de Fermi y la temperatura en unidades de la temperatura de Fermi. Normalizamos la densidad de estados a tres medios de raíz de épsilon, de modo que a temperatura cero hay exactamente un electrón por partícula y la energía interna es tres quintos.", "La expansión de Sommerfeld predice tres cosas que vamos a contrastar: el potencial químico baja como uno menos pi cuadrado sobre doce por t al cuadrado; la energía térmica crece como pi cuadrado sobre cuatro por t al cuadrado; y la capacidad calorífica es lineal, pi cuadrado medios por t. Es decir, en estas unidades esperamos γ = π²/2, aproximadamente 4.935.", "Para un metal típico, la temperatura de Fermi es de decenas de miles de kelvin, así que a temperatura ambiente t es del orden de milésimas. Joan, ¿cómo resolvimos esto en el computador?"]}, {"cabecera": "Diapositiva 6 · Esquema del algoritmo · Joan · 6:30–7:30", "parrafos": ["Joan: Gracias, Sebastián. El programa sigue este esquema. Tomamos una rejilla de 200 temperaturas entre t = 0.01 y t = 0.5. Para cada temperatura hacemos dos cosas: primero encontramos el potencial químico que conserva el número de electrones, y con ese μ integramos la energía interna. Cuando tenemos U en toda la rejilla, Jorge la deriva para obtener la capacidad calorífica. Todo está en Python, con NumPy, SciPy y Matplotlib, en un repositorio de GitHub que compartimos los tres."]}, {"cabecera": "Diapositiva 7 · Ecuación de ligadura · Joan · 7:30–9:15", "parrafos": ["Joan: La ecuación de ligadura dice que la integral de g por f tiene que dar uno para cualquier temperatura. La incógnita es μ, y la escribimos como un problema de raíces: F(μ) = N(μ) − 1 = 0.", "Implementamos el método de Newton-Raphson. La ventaja es que la derivada de F también se calcula con una integral: es g multiplicada por menos la derivada de Fermi-Dirac, que es un pico centrado en μ. Esa derivada siempre es positiva, así que N crece con μ y la raíz es única.", "Para que el método no falle, le pusimos una salvaguarda. Mantenemos un intervalo que siempre contiene la raíz, y si un paso de Newton se sale de él, hacemos un paso de bisección. Además usamos continuación: el μ de una temperatura es la semilla de la siguiente. Con eso el método converge en tres o cuatro iteraciones por temperatura. Para verificar, comparamos con el método de Brent de SciPy, y la diferencia máxima es de 1.4×10⁻¹⁴."]}, {"cabecera": "Diapositiva 8 · Resultado μ(T) · Joan · 9:15–10:30", "parrafos": ["Joan: Este es el resultado. La curva azul es nuestro μ numérico y la roja punteada es la predicción de Sommerfeld. A bajas temperaturas coinciden; por ejemplo, en t = 0.01 obtenemos 0.99991774 y la fórmula da 0.99991775: coinciden hasta la séptima cifra decimal. Al subir la temperatura las curvas se separan, porque la fórmula es solo el primer término de una serie. En t = 1 el potencial químico ya es ligeramente negativo, −0.021, que es el comportamiento de un gas clásico.", "Lo más importante es que el número de electrones se conserva: la desviación máxima de N respecto a uno, en toda la rejilla, es de 10⁻¹⁴, prácticamente la precisión de la máquina."]}, {"cabecera": "Diapositiva 9 · Integración adaptativa · Joan · 10:30–12:00", "parrafos": ["Joan: Con μ conocido, calculamos la energía interna. El reto es que, a baja temperatura, Fermi-Dirac cambia de uno a cero en una franja muy angosta. Si usáramos una regla de paso fijo, como Simpson, necesitaríamos muchísimos puntos.", "Por eso usamos cuadratura adaptativa de Gauss-Kronrod, de la librería QUADPACK que viene en SciPy. El método estima el error en cada subintervalo y solo divide donde hace falta. En la animación se ve: al bajar la temperatura, las líneas rojas, que son los bordes de los subintervalos, se amontonan alrededor de μ, y con el mismo número de evaluaciones Simpson comete un error mucho mayor. Le indicamos que hay un punto delicado en E = μ para que refine ahí, y le pedimos tolerancia relativa de 10⁻¹³.", "La integral va en principio hasta infinito, pero la cola de Fermi-Dirac decae como e^−(E−μ)/k_BT. Cortamos en μ más 40 k_BT, donde la cola vale unos 10⁻¹⁸. Comprobamos que si movemos el corte a 30 o a 60 k_BT la energía cambia menos de 10⁻¹³."]}, {"cabecera": "Diapositiva 10 · Energía térmica · Joan · 12:00–13:00", "parrafos": ["Joan: Aquí está la energía térmica, es decir, la energía interna menos su valor a temperatura cero, tres quintos. Crece como t al cuadrado, como predice Sommerfeld. Al ajustar a baja temperatura obtenemos un coeficiente de 2.461, frente a pi cuadrado sobre cuatro, 2.467. La diferencia de 0.3 % viene de la corrección de orden t⁴, que el ajuste a una parábola pura no incluye; es el mismo efecto que Jorge va a corregir en el ajuste de γ. Con esta curva ya tenemos todo lo necesario para la capacidad calorífica. Jorge, sigue tú."]}, {"cabecera": "Diapositiva 11 · Diferenciación numérica · Jorge · 13:00–14:15", "parrafos": ["Jorge: Gracias, Joan. La capacidad calorífica es la derivada de la energía interna respecto a la temperatura. Como tenemos U en una rejilla, usamos diferencias centrales: U en T más h, menos U en T menos h, dividido entre 2h. El error de esta fórmula es proporcional a h al cuadrado. En los extremos de la rejilla no hay vecino a ambos lados, así que usamos una fórmula de un solo lado, también de segundo orden.", "Un punto importante: derivar amplifica el ruido. Un error de 10⁻⁶ en U, que parece pequeño, al dividir entre 2h = 0.005 se convierte en un error de casi 0.5 % en C_V a la temperatura más baja. Por eso fue necesaria la alta precisión de la integración que explicó Joan."]}, {"cabecera": "Diapositiva 12 · C_V(T) frente a Sommerfeld · Jorge · 14:15–15:45", "parrafos": ["Jorge: Este es el resultado principal. La curva azul es la capacidad calorífica numérica y la roja es la recta de Sommerfeld. A bajas temperaturas son prácticamente iguales: el comportamiento es lineal.", "A la derecha está el cociente entre las dos. En t = 0.1 la simulación da el 96.7 % del valor lineal; en t = 0.3, el 71 %; y en t = 0.5, el 51 %. Esto muestra hasta dónde vale la aproximación lineal. Si agregamos el siguiente término de la expansión, menos 3π⁴/20 por t al cubo, la curva magenta, el acuerdo se extiende hasta t ~ 0.2. Más allá, esa curva se dobla hacia abajo y se vuelve negativa cerca de t = 0.6: la expansión de Sommerfeld es una serie en potencias de t y solo sirve a baja temperatura. El cálculo numérico no tiene esa limitación.", "A temperaturas del orden de la temperatura de Fermi, la capacidad calorífica se acerca al valor clásico de tres medios. Es decir, el mismo programa reproduce los dos límites: el cuántico a baja temperatura y el clásico a alta temperatura."]}, {"cabecera": "Diapositiva 13 · Extracción de γ · Jorge · 15:45–17:00", "parrafos": ["Jorge: Para extraer el coeficiente lineal γ hicimos un ajuste por mínimos cuadrados con los puntos de t menor o igual a 0.05. Primero ajustamos una recta pura que pasa por el origen y obtuvimos 4.912, que es medio por ciento menor que el valor teórico. Ese error no viene de la derivada, sino del modelo de ajuste: incluso a t = 0.05 la corrección cúbica ya pesa un poco.", "Cuando ajustamos γt más δt³, obtenemos γ = 4.93493 frente a π²/2 = 4.93480, un error de tres milésimas de por ciento. El coeficiente cúbico sale −15.0, cercano al teórico de −14.6. También comprobamos la convergencia: al pasar de 50 a 400 puntos en la rejilla, γ se estabiliza en la cuarta cifra decimal.", "(Gráfica animada: si C_V = γt + δt³, entonces C_V/t = γ + δt² es una recta en función de t². Donde la recta corta el eje vertical se lee γ directamente.)"]}, {"cabecera": "Diapositiva 14 · Aplicación al cobre · Jorge · 17:00–18:30", "parrafos": ["Jorge: Ahora llevemos esto a un metal real. El cobre tiene una energía de Fermi de unos 7 eV, que corresponde a una temperatura de Fermi de unos 81 000 kelvin. A temperatura ambiente, t es apenas 0.0037, así que estamos en el régimen lineal.", "Al pasar nuestro γ a unidades físicas obtenemos 0.505 milijoules por mol por kelvin al cuadrado. El valor medido en el cobre es 0.695. La diferencia de un 38 % se interpreta como una masa efectiva de los electrones: el modelo de electrones libres no incluye la red cristalina ni la interacción con los fonones, y esos efectos hacen que los electrones se comporten como si pesaran 1.38 veces más.", "A 300 K la contribución electrónica es de unos 0.15 J/(mol K), frente a 25 de la red, y apenas el 1.2 % de los 12.5 J/(mol K) que predecía la física clásica. Esa es la diferencia de la que hablaba Sebastián al principio. A temperaturas muy bajas, en cambio, la red decae como T³ y los electrones dominan.", "(Gráfica animada: C/T contra T² es una recta. El corte con el eje es γ y la pendiente es la red. La recta roja usa el γ medido y la azul el γ calculado: la distancia entre los cortes es la masa efectiva.)"]}, {"cabecera": "Diapositiva 15 · Conclusiones · Jorge · 18:30–19:30", "parrafos": ["Jorge: Para concluir: primero, resolvimos la ecuación de ligadura con un Newton-Raphson salvaguardado que conserva el número de electrones a precisión de máquina en tres o cuatro iteraciones. Segundo, la cuadratura adaptativa nos permitió integrar el escalón de Fermi-Dirac con precisión de 10⁻¹³, suficiente para derivar sin amplificar errores. Tercero, la capacidad calorífica numérica es lineal a baja temperatura, y el γ que extraemos coincide con π²/2 dentro de 0.003 %. Cuarto, el mismo cálculo muestra dónde deja de valer Sommerfeld y cómo se recupera el límite clásico."]}, {"cabecera": "Diapositiva 16 · Cierre · Sebastián · 19:30–20:00", "parrafos": ["Sebastián: En resumen, con un modelo sencillo y tres métodos numéricos bien controlados explicamos por qué los electrones de un metal casi no contribuyen al calor específico. El código está en nuestro repositorio de GitHub. Muchas gracias; con gusto respondemos sus preguntas."]}];

/* =====================================================================
   1. FÍSICA (misma que sommerfeld_cv.py) — unidades: ε=E/E_F, t=T/T_F
   ===================================================================== */
const XGK=[0.991455371120812639,0.949107912342758525,0.864864423359769073,0.741531185599394440,
           0.586087235467691130,0.405845151377397167,0.207784955007898468,0];
const WGK=[0.022935322010529225,0.063092092629978553,0.104790010322250184,0.140653259715525919,
           0.169004726639267903,0.190350578064785410,0.204432940075298892,0.209482141084727828];
const WG=[0.129484966168869693,0.279705391489276668,0.381830050505118945,0.417959183673469388];
function gk15(f,a,b){const c=.5*(a+b),h=.5*(b-a),fc=f(c);let rk=fc*WGK[7],rg=fc*WG[3];
  for(let j=0;j<7;j++){const x=h*XGK[j],s=f(c-x)+f(c+x);rk+=WGK[j]*s;if(j%2===1)rg+=WG[(j-1)/2]*s;}
  return [rk*h,Math.abs((rk-rg)*h)];}
/* Cuadratura adaptativa: Gauss-Kronrod 7-15 con bisección donde el error estimado es grande */
function quad(f,a,b,pts,tol,info){tol=tol||1e-14;
  const ed=[a,...(pts||[]).filter(p=>p>a&&p<b).sort((x,y)=>x-y),b],st=[];
  for(let i=0;i<ed.length-1;i++)st.push([ed[i],ed[i+1]]);
  let tot=0,nev=0;
  while(st.length){const [x0,x1]=st.pop(),[v,e]=gk15(f,x0,x1);nev+=15;
    if(e<tol*Math.max(1,x1-x0)||x1-x0<1e-12){tot+=v;if(info)info.iv.push(x0,x1);}
    else{const m=.5*(x0+x1);st.push([x0,m],[m,x1]);}}
  if(info)info.nev=nev;return tot;}
const expit=x=>{if(x>=0)return 1/(1+Math.exp(-x));const z=Math.exp(x);return z/(1+z);};
const g=e=>1.5*Math.sqrt(Math.max(e,0));                 // densidad de estados 3D, ∫_0^1 g = 1
const fd=(e,t,mu)=>expit(-(e-mu)/t);                     // Fermi-Dirac
const NSIG=40;
function integ(h,mu,t,info){const em=Math.max(mu,0)+NSIG*t;return quad(h,0,em,(mu>0&&mu<em)?[mu]:null,1e-14,info);}
const Nn=(mu,t)=>integ(e=>g(e)*fd(e,t,mu),mu,t);
const Uu=(mu,t,info)=>integ(e=>e*g(e)*fd(e,t,mu),mu,t,info);
const dN=(mu,t)=>integ(e=>{const x=(e-mu)/t;return g(e)*expit(x)*expit(-x)/t;},mu,t);
/* Newton-Raphson con salvaguarda de bisección (ecuación de ligadura N(μ)=1) */
function newton(t,mu0,hist){let a=-30,b=5,mu=Math.min(Math.max(mu0,a+1e-3),b-1e-3);
  for(let k=1;k<=100;k++){const F=Nn(mu,t)-1;
    if(Math.abs(F)<1e-14){if(hist)hist.push({mu,F,d:NaN});return mu;}
    if(F>0)b=mu;else a=mu;
    const d=dN(mu,t);let nw=d>0?mu-F/d:.5*(a+b),bis=false;
    if(!(a<nw&&nw<b)){nw=.5*(a+b);bis=true;}
    if(hist)hist.push({mu,F,d,next:nw,bis});
    const st=Math.abs(nw-mu);mu=nw;if(st<1e-12)return mu;}
  return mu;}
function serie(t0,t1,n){const S={t:[],mu:[],it:[],N:[],U:[]};let m=1;
  for(let i=0;i<n;i++){const t=t0+(t1-t0)*i/(n-1),h=[];m=newton(t,m,h);
    S.t.push(t);S.mu.push(m);S.it.push(h.length);S.N.push(Nn(m,t));S.U.push(Uu(m,t));}
  const U=S.U,hh=S.t[1]-S.t[0];   // derivada: diferencias centrales O(h²), extremos de 2.º orden

        rd.innerHTML=`t = ${t.toFixed(3)}  pendiente = C<sub>V</sub> = <span class="b">${S.cv[i].toFixed(4)}</span>`;},1200,ELIN);}];}});

// 12 ─ C_V frente a Sommerfeld
scene({who:'Jorge',time:'14:15–15:45',part:'III · Resultados',title:'C_{V}(T) frente a Sommerfeld',build(r){
  const S=D.ext;
  const p=new Plot(r,{x:40,y:190,w:1000,h:790,xr:[0,1],yr:[0,2.2],xl:'t = T/T_{F}',yl:'C_{V}/(N k_{B})',xt:[0,.2,.4,.6,.8,1],yt:[0,.5,1,1.5,2]});
  const cv=p.curve(S.t.map((t,i)=>[t,S.cv[i]]),{color:BLUE,width:6}),li=p.curve(S.t.map(t=>[t,GTEO*t]),{color:RED,width:4,dash:'14 10'});
  const cu=p.curve(S.t.map(t=>[t,GTEO*t+DTEO*t**3]),{color:PURPLE,width:4,dash:'3 8'}),cl=p.hline(1.5,{color:GREY,width:3,dash:'2 7'});
  const T=(x,y,s,c,o)=>p.text(x,y,s,Object.assign({color:c,size:30,hidden:1},o||{}));
  const lc=T(.7,1.18,'numérico',BLUE),ll=T(.3,1.95,'(π^{2}/2) t',RED),lu=T(.44,.55,'(π^{2}/2) t − (3π^{4}/20) t^{3}',PURPLE),lk=T(.6,1.5,'límite clásico 3/2',GREY,{dy:-14});
  const q=new Plot(r,{x:1080,y:190,w:800,h:640,xr:[0,1],yr:[.25,1.05],xl:'t = T/T_{F}',yl:'C_{V} / C_{V}^{Somm}',xt:[0,.2,.4,.6,.8,1],yt:[.25,.5,.75,1]});
  const rr=q.curve(S.t.map((t,i)=>[t,S.cv[i]/(GTEO*t)]),{color:GREEN,width:6}),one=q.hline(1,{color:FG,width:2,dash:'8 8'});
  const mk=[.1,.3,.5].map(tv=>{const i=S.t.reduce((b,t,j)=>Math.abs(t-tv)<Math.abs(S.t[b]-tv)?j:b,0),v=S.cv[i]/(GTEO*S.t[i]);
    return[q.dot(S.t[i],v,{color:YELLOW}),q.text(S.t[i],v,(100*v).toFixed(1)+' %',{dx:16,dy:tv<.2?40:-12,color:YELLOW,hidden:1,size:30})];});
  $(r,'La recta de Sommerfeld vale a baja T; a t ~ 1 los electrones se comportan como un gas clásico.',1090,880,{w:790,cls:'small fade',step:4,delay:1600});
  return[A=>{p.axes(A,200);cv.draw(A,900,2200);lc.fade(A,2800);},A=>{li.draw(A,0,1500);ll.fade(A,1200);},
    A=>{cu.draw(A,0,1600);lu.fade(A,1300);},A=>{cl.draw(A,0,1000);lk.fade(A,700);},
    A=>{q.axes(A,0);one.draw(A,600,600);rr.draw(A,800,1800);mk.forEach(([d,t],k)=>{d.pop(A,1500+k*400);t.fade(A,1600+k*400);});}];}});

// 13 ─ γ
scene({who:'Jorge',time:'15:45–17:00',part:'III · Resultados',title:'Extracción del coeficiente lineal γ',build(r){
  const S=D.fit,aj=D.aj,pts=aj.idx.map(i=>[S.t[i]**2,S.cv[i]/S.t[i]]);
  const p=new Plot(r,{x:40,y:300,w:1150,h:690,xr:[0,.0026],yr:[4.88,4.945],xl:'t^{2}',yl:'C_{V} / t',L:130,
    xt:[0,.0005,.001,.0015,.002,.0025],yt:[4.89,4.9,4.91,4.92,4.93,4.94],fx:v=>fmt(v,4),fy:v=>v.toFixed(2)});
  eq(r,R(CV,mo('='),mi('γ'),mi('t'),mo('+'),mi('δ'),sp(mi('t'),mn(3)),mo('  ⟹  '),fr(CV,mi('t')),mo('='),Cl(YELLOW,mi('γ')),mo('+'),mi('δ'),sp(mi('t'),mn(2))),0,190,{w:1920,align:'center',size:48,step:0,delay:900});
  const dots=pts.map(([x,y])=>p.dot(x,y,{color:BLUE,r:8}));
  const fit=p.line(0,aj.g2,.0026,aj.g2+aj.d2*.0026,{color:YELLOW,width:4}),gd=p.dot(0,aj.g2,{color:YELLOW,r:12});

,hidden:1,size:32});
  const th=p.hline(GTEO,{color:RED,width:2.5,dash:'10 8'}),tl=p.text(.0026,GTEO,'π^{2}/2 = 4.934802',{anchor:'end',dy:-12,color:RED,hidden:1,size:28});
  const nv=p.hline(aj.g1,{color:GOLD,width:2.5,dash:'3 7'}),nl=p.text(.0026,aj.g1,'ajuste C_{V} = γt: '+aj.g1.toFixed(4),{anchor:'end',dy:34,color:GOLD,hidden:1,size:28});
  const err=v=>(100*(v/GTEO-1)).toFixed(4)+' %';
  $(r,`<div class="small">Ajuste con los puntos t ≤ 0.05:</div>
    <div style="font-size:36px;margin-top:10px"><span class="y">γ = ${aj.g2.toFixed(6)}</span></div>
    <div class="small">error frente a π²/2: <span class="y">${err(aj.g2)}</span></div>
    <div class="small" style="margin-top:14px">δ ajustado = ${aj.d2.toFixed(2)} &nbsp;(teoría ${DTEO.toFixed(2)})</div>`,1250,330,{w:560,cls:'card fade',step:2,delay:1400});
  $(r,`<div class="small"><span class="g">Recta pura C<sub>V</sub> = γt:</span> ${aj.g1.toFixed(4)} (${err(aj.g1)})<br>Promedia C<sub>V</sub>/t sin corregir la pendiente δ, por eso sale bajo.</div>`,1250,640,{w:560,cls:'card fade',step:3});
  $(r,'<table class="tb"><tr><th>puntos</th><th>γ</th></tr><tr><td>50</td><td>4.933624</td></tr><tr><td>100</td><td>4.934682</td></tr><tr><td>200</td><td>4.934927</td></tr><tr><td>400</td><td>4.934981</td></tr></table><div class="small" style="margin-top:8px">convergencia con el paso h</div>',
    1250,820,{cls:'fade',step:4,style:'transform-origin:0 0'});
  return[A=>{p.axes(A,200);},A=>{dots.forEach((d,k)=>d.pop(A,k*120));},
    A=>{fit.draw(A,0,1400);gd.pop(A,1300);gl.fade(A,1400);th.draw(A,1800,800);tl.fade(A,2200);},
    A=>{nv.draw(A,0,900);nl.fade(A,700);}];}});

// 14 ─ Cobre
scene({who:'Jorge',time:'17:00–18:30',part:'III · Resultados',title:'Aplicación a un metal real: el cobre',build(r){
  const GEXP=.695,TH=343,BETA=12*Math.PI**4*8.314462618/(5*TH**3)*1e3;
  const cards=[['E<sub>F</sub> = 7.0 eV','T<sub>F</sub> = ','',D.TF,0,' K','a 300 K: t = '+(300/D.TF).toFixed(4),TEAL],

  const el=cards.map(([a,b,_,v,d,u,c,col],k)=>{const e=$(r,`<div class="small">${a}</div><div style="font-size:46px;color:${col};margin:8px 0">${b}<span class="v">0</span>${u}</div><div class="small gr">${c}</div>`,
    90+k*440,210,{w:400,cls:'card fade',step:k<1?0:k<3?1:3,align:'center',style:'padding:20px 10px'});return{e,v,d};});
  const count=(A,k,d)=>{const c=el[k];A.tw(1300,p=>c.e.querySelector('.v').textContent=c.d?(p*c.v).toFixed(c.d):Math.round(p*c.v).toLocaleString('fr-FR'),d,EO);};
  const p=new Plot(r,{x:60,y:470,w:1150,h:560,xr:[0,25],yr:[0,2.0],xl:'T^{2}  [K^{2}]',yl:'C/T  [mJ/(mol K^{2})]',xt:[0,5,10,15,20,25],yt:[0,.5,1,1.5,2]});
  const ex=p.line(0,GEXP,25,GEXP+BETA*25,{color:RED,width:5}),te=p.line(0,D.gfis,25,D.gfis+BETA*25,{color:BLUE,width:4,dash:'12 9'});
  const de=p.dot(0,GEXP,{color:RED,r:11}),dt=p.dot(0,D.gfis,{color:BLUE,r:11});
  const le=p.text(1.2,GEXP+BETA*1.2,'electrones reales + red',{dy:-22,color:RED,hidden:1}),lt=p.text(1.2,D.gfis+BETA*1.2,'electrones libres + red',{dy:46,color:BLUE,hidden:1});
  eq(r,R(fr(mi('C'),mi('T')),mo('='),Cl(YELLOW,mi('γ')),mo('+'),mi('β'),sp(mi('T'),mn(2))),1290,500,{size:56,step:2});
  $(r,'El corte con el eje es γ; la pendiente β es la red (Debye, θ<sub>D</sub> = 343 K). <span class="gr">Rectas modelo, no datos medidos.</span>',1290,640,{w:580,cls:'small fade',step:2,delay:600});
  $(r,'El modelo de electrones libres no incluye el potencial de la red ni la interacción electrón-fonón: ambos se resumen en m*/m.',1290,830,{w:580,cls:'small fade',step:3,delay:600});
  return[A=>count(A,0,300),A=>{count(A,1,200);count(A,2,600);},
    A=>{p.axes(A,0);ex.draw(A,700,1500);te.draw(A,1000,1500);de.pop(A,2200);dt.pop(A,2400);le.fade(A,2300);lt.fade(A,2500);},
    A=>count(A,3,300)];}});

/* =====================================================================
   4. NAVEGACIÓN, HUD, PRESENTADOR
   ===================================================================== */
const stage=document.getElementById('stage'),hud=document.getElementById('hud');
let PW=null,T0=null;
function header(r,sc,i){if(sc.portada)return;const c=QUIEN[sc.who];
  $(r,sc.part,92,52,{cls:'part fade',step:0,color:c});
  $(r,htm(sc.title),90,82,{cls:'ttl write',step:0});
  $(r,`${sc.who} · ${sc.time}`,1500,62,{cls:'badge fade',step:0,style:`border-color:${c};color:${c};right:60px;left:auto`});}
function render(i,j,inst){GEN++;const gen=GEN;CUR=i;if(ROOT)ROOT.remove();
  const r=document.createElement('div');r.className='slide';stage.insertBefore(r,hud);ROOT=r;
  header(r,SC[i],i);const st=SC[i].build(r)||[];r._st=st;
  const ds=[...r.querySelectorAll('[data-step]')].map(e=>+e.dataset.step+1);r._tot=Math.max(st.length,1,...ds);
  if(j<0||j>=r._tot)j=r._tot-1;STEP=j;
  r.classList.add('noanim');for(let k=0;k<j;k++)apply(r,k,true,gen);
  if(inst)apply(r,j,true,gen);void r.offsetWidth;r.classList.remove('noanim');void r.offsetWidth;
  if(!inst)apply(r,j,false,gen);hudUpd();}
function apply(r,k,inst,gen){r.querySelectorAll(`[data-step="${k}"]`).forEach(e=>e.classList.add('on'));const f=r._st[k];if(f)f(mkA(inst,gen));}
function next(){if(T0===null)T0=Date.now();if(STEP+1<ROOT._tot){STEP++;apply(ROOT,STEP,false,GEN);hudUpd();}else if(CUR+1<SC.length)render(CUR+1,0);}
function prev(){if(STEP>0)render(CUR,STEP-1,true);else if(CUR>0)render(CUR-1,-1,true);}
function go(i){render(Math.max(0,Math.min(SC.length-1,i)),0);}
function hudUpd(){const c=QUIEN[SC[CUR].who];document.getElementById('num').textContent=`${CUR+1} / ${SC.length}`;
  const b=document.getElementById('bar');b.style.width=(100*(CUR+(STEP+1)/ROOT._tot)/SC.length)+'%';b.style.background=c;
  history.replaceState(null,'',`#${CUR+1}.${STEP}`);
  const n=NOTAS[CUR];document.getElementById('notas').innerHTML=n?`<b>${n.cabecera}</b>`+n.parrafos.map(p=>`<p>${p}</p>`).join(''):'';
  enviar();}
function estado(){return{i:CUR,j:STEP,tot:ROOT?ROOT._tot:1,n:SC.length,t0:T0,
  sc:SC.map(s=>({who:s.who,time:s.time,title:s.title||(s===SC[0]?'Portada':'Cierre')}))};}
function enviar(){if(PW&&!PW.closed)PW.postMessage({tipo:'estado',e:estado()},'*');}
function pantalla(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
function teclas(e){const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0);else if(k==='End')go(SC.length-1);
  else if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(k==='n'||k==='N'){const d=document.getElementById('notas');d.style.display=d.style.display==='block'?'none':'block';}
  else if(k==='t'||k==='T'){const d=document.getElementById('timer');d.style.display=d.style.display==='block'?'none':'block';}
  else if(k==='p'||k==='P'){PW=window.open(location.href.split('#')[0].split('?')[0]+'?presentador','presentador','width=1000,height=760');}}
function principal(){
  pantalla();addEventListener('resize',pantalla);
  setTimeout(()=>{const t=performance.now();calc();console.log('física calculada en',(performance.now()-t).toFixed(0),'ms');
    document.getElementById('carga').remove();
    const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);if(m)render(Math.min(SC.length,+m[1])-1,+(m[2]||0),true);else render(0,0);
    setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
    addEventListener('keydown',teclas);
    stage.addEventListener('click',e=>{if(e.button===0)next();});
    addEventListener('message',e=>{const d=e.data||{};if(d.cmd==='next')next();else if(d.cmd==='prev')prev();else if(d.cmd==='hola'){PW=e.source;enviar();}});
    setInterval(()=>{const d=document.getElementById('timer');if(T0)d.textContent=reloj(Date.now()-T0);},500);},50);}
const reloj=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const aSeg=x=>{const [m,s]=x.split(':').map(Number);return 60*m+s;};
function presentador(){
  document.body.className='pres';
  const box=document.createElement('div');box.id='pres';document.body.appendChild(box);
  box.innerHTML=`<div class="top"><div><div class="who" id="q"></div><div class="meta" id="m"></div></div><div style="text-align:right"><div class="clock" id="c">00:00</div><div class="meta" id="obj"></div></div></div>
    <div style="margin:14px 0"><button id="bp">◀ Anterior</button><button id="bn">Siguiente ▶</button><span class="meta">(o use las flechas en esta ventana)</span></div>
    <div class="nt" id="nt"></div><hr><div class="meta" id="sig"></div>`;
  let E=null;const cmd=c=>{if(window.opener)window.opener.postMessage({cmd:c},'*');};
  document.getElementById('bp').onclick=()=>cmd('prev');document.getElementById('bn').onclick=()=>cmd('next');
  addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();cmd('next');}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();cmd('prev');}});
  addEventListener('message',e=>{if(e.data&&e.data.tipo==='estado'){E=e.data.e;pinta();}});
  function pinta(){if(!E)return;const s=E.sc[E.i],n=NOTAS[E.i],col=QUIEN[s.who];
    document.getElementById('q').innerHTML=`<span style="color:${col}">${s.who}</span> · ${s.title.replace(/_\{([^}]*)\}/g,'$1')}`;
    document.getElementById('m').textContent=`Diapositiva ${E.i+1}/${E.n} · paso ${E.j+1}/${E.tot} · tiempo previsto ${s.time}`;
    document.getElementById('nt').innerHTML=n?n.parrafos.map(p=>`<p>${p}</p>`).join(''):'';
    const z=E.sc[E.i+1];document.getElementById('sig').textContent=z?`Siguiente: ${z.who} · ${z.title.replace(/_\{([^}]*)\}/g,'$1')}`:'Última diapositiva';}
  setInterval(()=>{if(!E||!E.t0)return;const el=Date.now()-E.t0,s=E.sc[E.i],fin=aSeg(s.time.split('–')[1])*1000;
    const c=document.getElementById('c');c.textContent=reloj(el);c.style.color=el>fin?'#FC6255':'#83C167';
    document.getElementById('obj').textContent=el>fin?`atrasados ${reloj(el-fin)}`:`quedan ${reloj(fin-el)} para esta diapositiva`;},500);
  const hola=()=>{if(window.opener)window.opener.postMessage({cmd:'hola'},'*');};hola();setTimeout(hola,500);}
if(new URLSearchParams(location.search).has('presentador'))presentador();else principal();
</script>
